name: Deploy Worker

# Deploys through the shared ry-ops/cf-deploy workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: ry-ops/cf-deploy/.github/workflows/worker.yml@c162ab4530c6cf879bb86de7c159db524a0d438f # main 2026-10-18
    with:
      account-id: 5dc9134dee1e699eac6044d2c919e3ec
      pre-deploy: npx wrangler d1 migrations apply driveiq --remote
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
